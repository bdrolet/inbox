name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'clients/**'
      - 'repo/**'
      - 'services/**'
      - 'models/**'
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push inbox-api image
        env:
          IMAGE: us-central1-docker.pkg.dev/bens-project-462804/inbox/inbox-api:latest
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy inbox-api \
            --image us-central1-docker.pkg.dev/bens-project-462804/inbox/inbox-api:latest \
            --region us-central1 \
            --project bens-project-462804

      # Terraform creates inbox-redirect (terraform/redirect.tf); this step only
      # rolls the image on an existing service. Creating it here would race the
      # apply and leave Terraform with a 409 on its own resource.
      - name: Deploy inbox-redirect (same image)
        run: |
          if gcloud run services describe inbox-redirect --region us-central1 --project bens-project-462804 >/dev/null 2>&1; then
            gcloud run deploy inbox-redirect \
              --image us-central1-docker.pkg.dev/bens-project-462804/inbox/inbox-api:latest \
              --region us-central1 \
              --project bens-project-462804
          else
            echo "inbox-redirect not created by Terraform yet — skipping"
          fi
